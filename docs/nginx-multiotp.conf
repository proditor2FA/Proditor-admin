    # Proditor: Browser auf / zur neuen Verwaltung, Webservice (POST) und Monitoring (check_http) bleiben unveraendert
    location = / {
            absolute_redirect off;
            set $proditor_redirect "";
            if ($request_method = GET) { set $proditor_redirect "G"; }
            if ($args = "") { set $proditor_redirect "${proditor_redirect}A"; }
            if ($http_user_agent ~ "Mozilla") { set $proditor_redirect "${proditor_redirect}B"; }
            if ($proditor_redirect = "GAB") { return 302 /admin/; }
    }

    # Proditor: moderne Verwaltung unter /admin/ (nur Master)
    location = /admin { absolute_redirect off; return 301 /admin/; }
    location ^~ /admin/ {
            alias /usr/local/bin/multiotp-admin/;
            index index.html;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
            location ~ ^/admin/api\.php$ {
                    include /etc/nginx/fastcgi_params;
                    fastcgi_param HTTPS on;
                    fastcgi_param SCRIPT_FILENAME /usr/local/bin/multiotp-admin/api.php;
                    fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
            }
            location ~ \.php$ { return 404; }
    }

